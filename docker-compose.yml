services:
  # Desarrollo: Metro + Expo Go (móvil) + web en http://localhost:8081
  app:
    build:
      context: .
      target: dev
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # Variables personales (IP, modo). Expo solo acepta estas en archivos .local
    env_file:
      - path: .env.local
        required: false
    environment:
      - EXPO_NO_TELEMETRY=1
    # $$ = el contenedor expande la variable (no docker compose)
    # watch-poll.js: hot reload en Windows (ver comentario en el script)
    command: ["sh", "-c", "node docker/watch-poll.js & exec npx expo start --$${EXPO_MODE:-lan}"]
    stdin_open: true
    tty: true

  # Producción web: build estático servido por nginx en http://localhost:8080
  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    profiles: ["prod"]

volumes:
  node_modules:
