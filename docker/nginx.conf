server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Requeridos por expo-sqlite en web (SharedArrayBuffer)
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|svg|ico|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header en un location anula los del server: repetirlos
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
